version: 2

seeds:
  - name: municipio
    description: |
      Diretório de municípios brasileiros com código IBGE de 7 dígitos.
      Snapshot da tabela `br_bd_diretorios_brasil.municipio` da Base dos Dados,
      reduzida a 3 colunas (`id_municipio`, `nome`, `sigla_uf`).
      Atualizar manualmente quando o IBGE publicar nova divisão municipal.
    config:
      column_types:
        id_municipio: varchar
        nome: varchar
        sigla_uf: varchar
    columns:
      - name: id_municipio
        description: Código IBGE de 7 dígitos.
        tests:
          - unique
          - not_null
      - name: nome
        description: Nome canônico do município (com acentos, caixa inicial maiúscula).
        tests:
          - not_null
      - name: sigla_uf
        description: Sigla da Unidade da Federação (2 letras maiúsculas).
        tests:
          - not_null
  - name: dicionario
    description: |
      Dicionário do dataset (padrão Base dos Dados): mapeia o código
      de cada coluna categórica codificada ao seu significado.
      Cobre as colunas indicador_* da tabela unidade_conservacao.
    config:
      column_types:
        id_tabela: varchar
        nome_coluna: varchar
        cobertura_temporal: varchar
        chave: varchar
        valor: varchar
    columns:
      - name: nome_coluna
        description: "Nome da coluna categórica traduzida."
        tests: [not_null]
      - name: chave
        description: "Código armazenado no dado (STRING, preserva semântica do código)."
        tests: [not_null]
      - name: valor
        description: "Significado legível da chave, padronizado (inicial maiúscula)."
        tests: [not_null]

