[project]
name = "desafio-base-de-dados"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "basedosdados>=2.0.3",
    "boto3>=1.43.14",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.3",
    "polars>=1.41.1",
    "prefect>=3.7.2",
    "prefect-dbt>=0.7.24",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.6.0",
    "pykernel>=0.1.6",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# pipe.py é cola de orquestração: o decorator @task do Prefect roda síncrono
# dentro do @flow, mas mypy tipa o retorno como coroutine (falso positivo).
[[tool.mypy.overrides]]
module = "pipelines.pipe"
disable_error_code = ["unused-coroutine"]
